# Rebuilds index.json on main. Roadie reads the index from
# raw.githubusercontent.com, so a merged recipe is live once this commits.
name: Index

on:
  push:
    branches: [main]
    paths: ["recipes/**", "scripts/index.mjs"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/index.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.json; then echo "index.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "Rebuild index.json"
          git push
